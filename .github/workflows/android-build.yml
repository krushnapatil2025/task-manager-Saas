name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.VITE_GOOGLE_SERVICE_ACCOUNT_KEY }}
          VITE_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.VITE_GOOGLE_DRIVE_FOLDER_ID }}
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DRIVE_CLIENT_ID }}
          VITE_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DRIVE_CLIENT_SECRET }}
          VITE_GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.VITE_GOOGLE_DRIVE_REFRESH_TOKEN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ADMIN_INVITE_TOKEN: ${{ secrets.VITE_ADMIN_INVITE_TOKEN }}
          VITE_BREVO_API_KEY: ${{ secrets.VITE_BREVO_API_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_SENDER_EMAIL: ${{ secrets.VITE_SENDER_EMAIL }}
          VITE_SENDER_NAME: ${{ secrets.VITE_SENDER_NAME }}
          VITE_SUPER_ADMIN_EMAIL: ${{ secrets.VITE_SUPER_ADMIN_EMAIL }}
          VITE_SUPER_ADMIN_PASSWORD: ${{ secrets.VITE_SUPER_ADMIN_PASSWORD }}
          VITE_SUPER_ADMIN_SECRET: ${{ secrets.VITE_SUPER_ADMIN_SECRET }}
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Synchronize Capacitor Project
        run: npx cap sync android

      - name: Build Android App (APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

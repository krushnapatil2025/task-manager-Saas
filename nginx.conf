# ════════════════════════════════════════════════════════════════════
# Nginx Configuration — Strideo Task Manager (AWS EC2)
# ════════════════════════════════════════════════════════════════════
# SETUP INSTRUCTIONS:
#   1. SSH into your EC2 instance
#   2. Copy this file:
#        sudo cp nginx.conf /etc/nginx/sites-available/strideo
#   3. Replace YOUR_EC2_IP_OR_DOMAIN with your actual IP or domain
#   4. Enable site:
#        sudo ln -s /etc/nginx/sites-available/strideo /etc/nginx/sites-enabled/
#        sudo rm /etc/nginx/sites-enabled/default
#   5. Test and reload:
#        sudo nginx -t && sudo systemctl reload nginx
# ════════════════════════════════════════════════════════════════════

server {
    listen 80;
    # ── CHANGE THIS: your EC2 Public IP or domain name ──────────────
    # Example: server_name 13.234.56.78;
    # Example: server_name task.yourdomain.com www.task.yourdomain.com;
    server_name YOUR_EC2_IP_OR_DOMAIN;

    # ── Path to built React app ──────────────────────────────────────
    root /var/www/strideo/dist;
    index index.html;

    # ── Gzip Compression (faster page loads) ────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;
    gzip_min_length 256;

    # ── Cache Static Assets (JS, CSS, images — long-lived) ──────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Service Worker — NEVER cache this file ───────────────────────
    # Without this, users get stale PWA version after deploy
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Workbox Service Worker files ─────────────────────────────────
    location /workbox-*.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ── SPA Fallback — CRITICAL for React Router ─────────────────────
    # Without this rule, refreshing /calendar, /admin/tasks etc = 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security Headers ─────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Error Pages ──────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # ── Log Files ────────────────────────────────────────────────────
    access_log /var/log/nginx/strideo_access.log;
    error_log  /var/log/nginx/strideo_error.log;
}
